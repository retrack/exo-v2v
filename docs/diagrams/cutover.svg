<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 960 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cutover-title cutover-desc" id="cutover-root">
        <title id="cutover-title">What happens at cutover</title>
        <desc id="cutover-desc">At cutover the appliance shuts the source VM down, copies the last changes, asks the target instance's agent to convert the guest for KVM and adapt it to Exoscale, rebuilds incompatible data volumes if needed, then scales and starts the instance until SSH or RDP answers.</desc>
        <defs>
      <style>#cutover-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #cutover-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cutover-root .diagram-container { width: 100%; overflow-x: auto; }
      #cutover-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#cutover-root .diagram-container { overflow-x: visible; }
}</style>
