<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 40 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="downtime-title downtime-desc" id="downtime-root">
        <title id="downtime-title">Downtime at cutover</title>
        <desc id="downtime-desc">Measured downtime of live migrations from vSphere to Exoscale, from source shutdown until SSH or RDP answered, per guest and firmware: Ubuntu about 2 minutes, Debian 4 to 5, AlmaLinux 6 to 7, Windows Server 5 to 9.</desc>
        <defs>
      <style>#downtime-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #downtime-root { font-family: var(--font-sans); color: var(--color-ink); }
      #downtime-root .diagram-container { width: 100%; overflow-x: auto; }
      #downtime-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#downtime-root .diagram-container { overflow-x: visible; }
}</style>
