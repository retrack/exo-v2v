<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 56 960 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="disks-title disks-desc" id="disks-root">
        <title id="disks-title">Where each VM disk goes</title>
        <desc id="disks-desc">A VM's system disk, read through its snapshot chain, becomes the root disk of the target instance. A disk that extends the root volume group is carried inside the root disk as an extra partition. The other disks become Block Storage volumes with 4 KiB sectors, their partition tables rescaled and 512-byte-sector filesystems or logical volumes rebuilt.</desc>
        <defs>
      <style>#disks-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #disks-root { font-family: var(--font-sans); color: var(--color-ink); }
      #disks-root .diagram-container { width: 100%; overflow-x: auto; }
      #disks-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#disks-root .diagram-container { overflow-x: visible; }
}</style>
