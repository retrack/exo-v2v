<!DOCTYPE html>
<html lang="en">
<head>

  <title>A migration from plan to cleanup</title>
  <!-- diagram-design skill, Exoscale skin, font source: system (no network requests) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · exo-v2v</p>

        </defs>

<circle cx="860.0" cy="268" r="5" fill="#212121"/>

<text x="860.0" y="156.0" fill="#212121" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Cleaned up</text>

<rect x="624" y="260" width="120" height="64" rx="6" fill="#fafafa"/>
<rect x="624" y="260" width="120" height="64" rx="6" fill="rgba(97,97,97,0.10)" stroke="#5f6368" stroke-width="1"/>

<text x="684.0" y="296.0" fill="#212121" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Rolled back</text>

<path d="M 456.4,393 H 484.4" fill="none" stroke="#616161" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="492.4" y="396" fill="#616161" font-size="8.5" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Command</text>
<path d="M 556.1,393 H 584.1" fill="none" stroke="#616161" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="592.1" y="396" fill="#616161" font-size="8.5" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fallback</text>
      </svg>
    </div>
    <p class="caption">Each step is resumable. Rollback works until cleanup; data written on Exoscale after the cutover is not copied back.</p>
