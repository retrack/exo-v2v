<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 960 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="create-template-title create-template-desc" id="create-template-root">
        <title id="create-template-title">Creating the receiver from a template</title>
        <desc id="create-template-desc">With a receiver template, the target instance boots straight into the RAM-root receiver, installs the migration's SSH key from its user-data, then exo-v2v attaches the Block Storage volumes and starts the agent.</desc>
        <defs>
      <style>#create-template-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #create-template-root { font-family: var(--font-sans); color: var(--color-ink); }
      #create-template-root .diagram-container { width: 100%; overflow-x: auto; }
      #create-template-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#create-template-root .diagram-container { overflow-x: visible; }
}</style>
