<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 56 960 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rehearsal-title rehearsal-desc" id="rehearsal-root">
        <title id="rehearsal-title">A rehearsal</title>
        <desc id="rehearsal-desc">Copies of the replicated VMs are seeded from the production replicas, Block Storage snapshots for the volumes and a root disk stream through the relay, then converted and started on isolated networks without a public IP or a router. People reach them only by SSH through the relay, which does not forward traffic. The sources and the production replication carry on.</desc>
        <defs>
      <style>#rehearsal-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #rehearsal-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rehearsal-root .diagram-container { width: 100%; overflow-x: auto; }
      #rehearsal-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#rehearsal-root .diagram-container { overflow-x: visible; }
}</style>
