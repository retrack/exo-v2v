<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 60 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="group-cutover-title group-cutover-desc" id="group-cutover-root">
        <title id="group-cutover-title">A group cutover</title>
        <desc id="group-cutover-desc">The tiers of an application stop front to back: the load balancer, then the application servers, then the database. Each VM's final copy and conversion start as soon as it is off, and the conversions overlap. The tiers then start back to front, each one only after the health checks of the previous one pass.</desc>
        <defs>
      <style>#group-cutover-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #group-cutover-root { font-family: var(--font-sans); color: var(--color-ink); }
      #group-cutover-root .diagram-container { width: 100%; overflow-x: auto; }
      #group-cutover-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#group-cutover-root .diagram-container { overflow-x: visible; }
}</style>
