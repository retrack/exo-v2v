<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 40 960 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc" id="lifecycle-root">
        <title id="lifecycle-title">A migration from plan to cleanup</title>
        <desc id="lifecycle-desc">The migration moves through planned, receiver ready, replicating and cut over states, driven by the exo-v2v commands create, sync, cutover and cleanup, with rollback available after the cutover.</desc>
        <defs>
      <style>#lifecycle-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      #lifecycle-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#lifecycle-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#616161"/></marker>
          <marker id="lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#da291c"/></marker>
          <marker id="lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f5d8c"/></marker>
        </defs>
