<text x="96" y="300" fill="#616161" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Downtime starts at cutover: shutdown, last delta, conversion, boot.</text>
<text x="96" y="320" fill="#616161" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Measured: 2 to 9 minutes. Every step before it runs with the VM online.</text>
