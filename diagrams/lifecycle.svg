<text x="508.0" y="172.0" fill="#616161" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">source running</text>
<rect x="624" y="120" width="120" height="64" rx="6" fill="#fafafa"/>
