<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 56 960 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">How exo-v2v moves a running VM</title>
        <desc id="architecture-desc">The replication appliance reads frozen snapshots of the source VM's disks inside vSphere and writes them through an SSH tunnel onto the disks of the target Exoscale instance, whose agent runs from RAM, booted from a receiver template or rebuilt from a stock template.</desc>
        <defs>
      <style>#architecture-root { --color-paper:  #fafafa;
      --color-ink:    #212121;
      --color-muted:  #616161;
      --color-accent: #da291c;
      --font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--color-muted);
               margin-top: 1rem; max-width: 60ch; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
